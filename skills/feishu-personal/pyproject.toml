[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-tools"
dynamic = ["version"]
description = "Lark/Feishu CLI built on reverse-engineered im/gateway APIs (no Open API needed)"
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "francis.wang2" }]
dependencies = [
    "requests>=2.28",
    "cryptography>=40",
    "qrcode[pil]>=7",
    "blake3>=0.3",
    "keyring>=23",
    "truststore>=0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lark = "lark_tools.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lark_tools.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["lark_tools*"]
exclude = ["scripts*", "memory*", "sniff_scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short -m 'not live'"
markers = [
    "live: hits real Feishu APIs; requires LARK_LIVE_TESTS=1 and a logged-in session",
]
