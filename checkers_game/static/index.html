<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际跳棋 - Checkers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>国际跳棋</h1>
        <div id="game-info">
            <div id="status-bar">
                <div id="current-turn" class="turn-indicator">
                    <span class="piece-icon red-piece"></span>
                    <span id="turn-text">红方回合</span>
                </div>
                <div id="message" class="message-box"></div>
            </div>
            <div id="score-board">
                <div class="score-item">
                    <span class="piece-icon red-piece"></span>
                    <span>红方: <span id="red-count">12</span></span>
                </div>
                <div class="score-item">
                    <span class="piece-icon black-piece"></span>
                    <span>黑方: <span id="black-count">12</span></span>
                </div>
            </div>
        </div>

        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="controls">
            <button id="reset-btn" class="btn">重新开始</button>
            <button id="ai-btn" class="btn">AI 走一步</button>
            <div id="game-over-modal" class="modal hidden">
                <div class="modal-content">
                    <h2 id="winner-text">游戏结束！</h2>
                    <button id="modal-reset-btn" class="btn">再来一局</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
